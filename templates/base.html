<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Politik i Praksis{% endblock %}</title>
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="/">Politik i Praksis</a>
      <nav class="main-nav">
        <a href="/">Forside</a>
        <a href="/medlemmer">Medlemmer</a>
        <a href="/bills">Lovforslag</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Skift til mørkt tema">🌙</button>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      Politik i Praksis er et uafhængigt projekt og er ikke en officiel side fra
      Folketinget. Data hentet fra
      <a href="https://www.ft.dk/da/dokumenter/aabne_data">Folketingets åbne data</a>.
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var html = document.documentElement;

      function isDark() {
        return html.getAttribute('data-theme') === 'dark'
          || (!html.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }

      function updateButton() {
        var dark = isDark();
        btn.textContent = dark ? '☀️' : '🌙';
        btn.setAttribute('aria-label', dark ? 'Skift til lyst tema' : 'Skift til mørkt tema');
      }

      btn.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateButton();
      });

      updateButton();
    })();
  </script>
</body>
</html>
