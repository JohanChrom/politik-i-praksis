{% extends "base.html" %}
{% block title %}MP'er - Politik i Praksis{% endblock %}
{% block content %}
  <h1>Folketingets medlemmer</h1>

  <form class="periode-picker" method="get">
    <label for="periode">Samling:</label>
    <select name="periode" id="periode" onchange="this.form.submit()">
      {% for label, periods in periode_groups %}
        <optgroup label="{{ label }}">
          {% for p in periods %}
            <option value="{{ p.id }}" {{ "selected" if p.id == selected_periode else "" }}>{{ p.titel }}</option>
          {% endfor %}
        </optgroup>
      {% endfor %}
    </select>
    <label for="q">Søg:</label>
    <input type="search" name="q" id="q" value="{{ q }}" placeholder="Navn...">
    <button type="submit">Vis</button>
  </form>

  {% if mps %}
    <ul class="mp-list">
      {% for mp in mps %}
        <li><a href="/mp/{{ mp.id }}">{{ mp.navn }}</a><br><small>{{ mp.party }}</small></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Ingen medlemmer matcher søgningen.</p>
  {% endif %}
{% endblock %}
